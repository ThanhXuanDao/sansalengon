# Docker Compose cho LOCAL DEVELOPMENT / TEST
# Dùng: docker compose -f docker-compose.local.yml up --build
# Database: Supabase (production DB)

services:
  api:
    build:
      context: .
      dockerfile: src/apps/api/Dockerfile.local
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://postgres.xcdvskkygvlqfezwacud:Sansalengon@804088@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true
      DIRECT_URL: postgresql://postgres.xcdvskkygvlqfezwacud:Sansalengon@804088@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
      NODE_ENV: production
      PORT: 4000
      WEB_URL: http://web:3000
    ports:
      - "4000:4000"

  web:
    build:
      context: ./src/apps/web
      dockerfile: Dockerfile.local
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://postgres.xcdvskkygvlqfezwacud:Sansalengon@804088@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true
      DIRECT_URL: postgresql://postgres.xcdvskkygvlqfezwacud:Sansalengon@804088@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      WEB_URL: http://localhost:3000
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    volumes:
      - ./src/apps/web/public:/app/public
